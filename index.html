<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع الذكاء الاصطناعي الخاص بي</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        #chat-box { background: white; padding: 15 clutching; border-radius: 8px; min-height: 200px; margin-bottom: 10px; border: 1px solid #ddd; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>
    <h1>مرحباً بك في مشروعي</h1>
    <div id="chat-box"></div>
    <input type="text" id="userInput" placeholder="اسألي Gemini أي شيء...">
    <button onclick="sendData()">إرسال</button>

    <script>
        async function sendData() {
            const input = document.getElementById('userInput').value;
            const chatBox = document.getElementById('chat-box');
            
            chatBox.innerHTML += `<p><b>أنتِ:</b> ${input}</p>`;
            
            // هنا بننادي الـ API بتاعنا اللي عملناه في الفولدر
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: input })
            });
            
            const result = await response.json();
            const aiResponse = result.candidates[0].content.parts[0].text;
            
            chatBox.innerHTML += `<p><b>Gemini:</b> ${aiResponse}</p>`;
            
            // بخصوص الـ Local Storage: لو عايزة تحفظي السؤال والرد "مؤقتاً"
            localStorage.setItem('last_chat', aiResponse);
        }
    </script>
</body>
</html>
